name: Build Wudroid APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Wudroid
        uses: actions/checkout@v6
      - name: Checkout Cemu Android core
        uses: actions/checkout@v6
        with:
          repository: SSimco/Cemu
          ref: android-port
          path: cemu-engine
          submodules: recursive
          fetch-depth: 1

      - name: Checkout WudCompressMobile core
        uses: actions/checkout@v6
        with:
          repository: CometinhaStudios/WudCompressAndroid
          ref: main
          path: wudcompress-mobile
          fetch-depth: 1


      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android native tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1" \
            "cmake;3.31.1"

      - name: Apply Wudroid independent frontend
        shell: bash
        run: |
          set -euo pipefail
          APP="cemu-engine/src/android/app"
          JAVA="$APP/src/main/java/info/cemu/cemu"

          rm -f "$JAVA/MainActivity.kt" "$JAVA/MainActivity.java"
          cp wudroid-overlay/MainActivity.kt "$JAVA/MainActivity.kt"

          mkdir -p "$JAVA/graphics"
          cp wudroid-overlay/WudroidVulkanX.kt "$JAVA/graphics/WudroidVulkanX.kt"
          cp wudroid-overlay/EmulationActivity.kt "$JAVA/emulation/EmulationActivity.kt"
          cp wudroid-overlay/WudroidEmulationSession.kt "$JAVA/emulation/WudroidEmulationSession.kt"

          mkdir -p "$JAVA/graphicpacks"
          cp wudroid-overlay/WudroidBundledGraphicPacks.kt \
            "$JAVA/graphicpacks/WudroidBundledGraphicPacks.kt"
          mkdir -p "$APP/src/main/assets/wudroid_graphic_packs/NewSuperMarioBrosU/Workarounds/CrashFix"
          cp wudroid-overlay/graphicpacks/NewSuperMarioBrosU/Workarounds/CrashFix/rules.txt \
            "$APP/src/main/assets/wudroid_graphic_packs/NewSuperMarioBrosU/Workarounds/CrashFix/rules.txt"
          cp wudroid-overlay/graphicpacks/NewSuperMarioBrosU/Workarounds/CrashFix/patch_CrashFix.asm \
            "$APP/src/main/assets/wudroid_graphic_packs/NewSuperMarioBrosU/Workarounds/CrashFix/patch_CrashFix.asm"
          mkdir -p "$APP/src/main/assets/wudroid_graphic_packs/NewSuperMarioBrosU/Graphics"
          cp -a wudroid-overlay/graphicpacks/NewSuperMarioBrosU/Graphics/. \
            "$APP/src/main/assets/wudroid_graphic_packs/NewSuperMarioBrosU/Graphics/"
          mkdir -p "$APP/src/main/assets/wudroid_graphic_packs/MinecraftWiiUEdition/Workarounds/CrashFix"
          cp -a wudroid-overlay/graphicpacks/MinecraftWiiUEdition/Workarounds/CrashFix/. \
            "$APP/src/main/assets/wudroid_graphic_packs/MinecraftWiiUEdition/Workarounds/CrashFix/"
          mkdir -p "$APP/src/main/assets/wudroid_graphic_packs/MinecraftWiiUEdition/Graphics/Resolution"
          cp -a wudroid-overlay/graphicpacks/MinecraftWiiUEdition/Graphics/Resolution/. \
            "$APP/src/main/assets/wudroid_graphic_packs/MinecraftWiiUEdition/Graphics/Resolution/"
          python3 wudroid-overlay/apply-graphicpacks.py

          cp -a wudroid-overlay/res/. "$APP/src/main/res/"

          python3 wudroid-overlay/apply-vulkanx.py
          python3 wudroid-overlay/apply-performance-overlay.py

          # Graphics settings + Wudroid Touch Layout v1.
          cp wudroid-overlay/WudroidGraphicsSettings.kt "$JAVA/WudroidGraphicsSettings.kt"
          cp wudroid-overlay/WudroidTouchLayout.kt "$JAVA/WudroidTouchLayout.kt"
          cp wudroid-overlay/WudroidResolutionManager.kt "$JAVA/WudroidResolutionManager.kt"
          cp wudroid-overlay/WudroidCoverArt.kt "$JAVA/WudroidCoverArt.kt"
          cp wudroid-overlay/WudroidAntiAliasingManager.kt "$JAVA/WudroidAntiAliasingManager.kt"
          cp wudroid-overlay/WudroidPerGameGraphics.kt "$JAVA/WudroidPerGameGraphics.kt"
          cp wudroid-overlay/WudroidCompatibilityManager.kt "$JAVA/WudroidCompatibilityManager.kt"
          cp wudroid-overlay/WudroidFrameGeneration.kt "$JAVA/WudroidFrameGeneration.kt"
          cp wudroid-overlay/WudroidFrameGenerationUi.kt "$JAVA/WudroidFrameGenerationUi.kt"
          cp wudroid-overlay/WudroidShaderPreload.kt "$JAVA/WudroidShaderPreload.kt"
          cp wudroid-overlay/WudroidKeyboardMouse.kt "$JAVA/emulation/WudroidKeyboardMouse.kt"
          mkdir -p "$JAVA/settings/input/controller"
          cp wudroid-overlay/WudroidKeyboardMouseSettings.kt \
            "$JAVA/settings/input/controller/WudroidKeyboardMouseSettings.kt"
          python3 wudroid-overlay/apply-graphics-touch-ui.py
          python3 wudroid-overlay/apply-touch-layout.py
          python3 wudroid-overlay/apply-v009-ui.py

          # Wudroid 0.1.0-A: WUX importer based on WudCompressMobile.
          mkdir -p "$APP/src/main/java/com/wudcompress/android/core"
          cp wudcompress-mobile/app/src/main/java/com/wudcompress/android/core/WudEngine.java \
            "$APP/src/main/java/com/wudcompress/android/core/WudEngine.java"
          cp wudroid-overlay/WudroidWuxImporter.kt "$JAVA/WudroidWuxImporter.kt"
          python3 wudroid-overlay/apply-v010-wux-importer.py
          python3 wudroid-overlay/apply-v010b-features.py
          python3 wudroid-overlay/apply-v011-framegen.py
          python3 wudroid-overlay/apply-v011e-shader-preload.py
          python3 wudroid-overlay/apply-v011f-library-input.py
          python3 wudroid-overlay/apply-v011h-full-controller-ui.py
          python3 wudroid-overlay/apply-v011i-original-sidebar-theme.py
          python3 wudroid-overlay/apply-v011j-original-sidebar-interaction.py
          python3 wudroid-overlay/apply-v011k-eden-dual-menu.py
          python3 wudroid-overlay/apply-v011l-right-quick-swipe-fix.py
          python3 wudroid-overlay/apply-v011m-right-edge-activity-bridge.py
          python3 wudroid-overlay/apply-v011n-menu-flow-gamepad.py
          python3 wudroid-overlay/apply-v011o-gamepad-editor.py
          python3 wudroid-overlay/apply-v011p-individual-gamepad-editor.py
          python3 wudroid-overlay/apply-v011q-editor-polish-ptbr.py
          python3 wudroid-overlay/apply-v011r-quickstate-engine.py
          python3 wudroid-overlay/apply-v011s-savestation.py
          python3 wudroid-overlay/apply-v011t-savestation-runtimefix.py
          python3 wudroid-overlay/apply-v011u-turbo-test13.py

          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("cemu-engine/src/android/app")
          gradle = app / "build.gradle.kts"
          s = gradle.read_text()
          s = s.replace('applicationId = "info.cemu.cemu"',
                        'applicationId = "com.cometinhastudios.wudroid"')
          s = re.sub(r'versionCode\s*=\s*(?:getVersionCode\(\)|\d+)', 'versionCode = 29', s)
          s = re.sub(r'versionName\s*=\s*(?:getVersionName\(\)|"[^"]*")',
                     'versionName = "0.1.1-turbo-test13"', s)
          gradle.write_text(s)

          strings = app / "src/main/res/values/strings.xml"
          if strings.exists():
              x = strings.read_text()
              x = re.sub(r'<string name="app_name">.*?</string>',
                         '<string name="app_name">Wudroid</string>', x, flags=re.S)
              strings.write_text(x)

          manifest = app / "src/main/AndroidManifest.xml"
          x = manifest.read_text()
          x = x.replace('android:label="@string/app_name"', 'android:label="Wudroid"')
          x = x.replace(
              'android:name=".MainActivity"\n            android:exported="true"',
              'android:name=".MainActivity"\n            android:exported="true"\n            android:label="Wudroid"'
          )
          manifest.write_text(x)

          if 'android:label="Wudroid"' not in manifest.read_text():
              raise SystemExit("Wudroid manifest label patch failed")
          if 'applicationId = "com.cometinhastudios.wudroid"' not in gradle.read_text():
              raise SystemExit("Wudroid applicationId patch failed")
          PY

      - name: Check Wudroid frontend Kotlin
        working-directory: cemu-engine/src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileReleaseKotlin :app:compileReleaseJavaWithJavac --stacktrace --no-daemon

      - name: Build release APK
        working-directory: cemu-engine/src/android
        env:
          VCPKG_FORCE_DOWNLOADED_BINARIES: 'true'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Sign installable APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find cemu-engine/src/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK was generated"
            exit 1
          fi

          keytool -genkeypair -v \
            -keystore out/wudroid-build.jks \
            -storepass wudroid \
            -keypass wudroid \
            -alias wudroid \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Wudroid Build,O=CometinhaStudios,C=BR" >/dev/null 2>&1

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 \
            "$APK" out/Wudroid-0.1.1-Turbo-Test13-aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" sign \
            --ks out/wudroid-build.jks \
            --ks-pass pass:wudroid \
            --key-pass pass:wudroid \
            --out out/Wudroid-0.1.1-Turbo-Test13.apk \
            out/Wudroid-0.1.1-Turbo-Test13-aligned.apk

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose \
            out/Wudroid-0.1.1-Turbo-Test13.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Wudroid-0.1.1-Turbo-Test13-APK
          path: out/Wudroid-0.1.1-Turbo-Test13.apk
          if-no-files-found: error
          compression-level: 0
