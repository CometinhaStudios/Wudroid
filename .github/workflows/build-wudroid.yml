name: Build Wudroid APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Wudroid
        uses: actions/checkout@v6

      # Use the maintained Android port directly. Its current .gitmodules uses
      # the public Exzap/ZArchive repository instead of the removed SSimco fork.
      - name: Checkout Cemu Android core
        uses: actions/checkout@v6
        with:
          repository: SSimco/Cemu
          ref: android-port
          path: cemu-engine
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Apply Wudroid frontend
        shell: bash
        run: |
          set -euo pipefail
          APP="cemu-engine/src/android/app"

          # Replace only the Android launcher/frontend. The emulation core stays
          # from the Android Cemu port.
          rm -f "$APP/src/main/java/info/cemu/cemu/MainActivity.kt"
          cp wudroid-overlay/MainActivity.java \
            "$APP/src/main/java/info/cemu/cemu/MainActivity.java"
          cp wudroid-overlay/AndroidManifest.xml \
            "$APP/src/main/AndroidManifest.xml"

          mkdir -p "$APP/src/main/assets"
          cp app/src/main/assets/index.html "$APP/src/main/assets/index.html"
          cp -a wudroid-overlay/res/. "$APP/src/main/res/"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('cemu-engine/src/android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('applicationId = "info.cemu.cemu"',
                        'applicationId = "com.cometinhastudios.wudroid"')
          s = re.sub(r'versionCode\s*=\s*getVersionCode\(\)', 'versionCode = 5', s)
          s = re.sub(r'versionName\s*=\s*getVersionName\(\)', 'versionName = "0.0.5"', s)
          p.write_text(s)
          PY

      - name: Build release APK
        working-directory: cemu-engine/src/android
        env:
          VCPKG_FORCE_DOWNLOADED_BINARIES: 'true'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Sign installable APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          APK="$(find cemu-engine/src/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK was generated"
            exit 1
          fi

          keytool -genkeypair -v \
            -keystore out/wudroid-build.jks \
            -storepass wudroid \
            -keypass wudroid \
            -alias wudroid \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Wudroid Build,O=CometinhaStudios,C=BR" >/dev/null 2>&1

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 \
            "$APK" out/Wudroid-0.0.5-aligned.apk

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" sign \
            --ks out/wudroid-build.jks \
            --ks-pass pass:wudroid \
            --key-pass pass:wudroid \
            --out out/Wudroid-0.0.5.apk \
            out/Wudroid-0.0.5-aligned.apk

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose \
            out/Wudroid-0.0.5.apk
          ls -lh out/Wudroid-0.0.5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Wudroid-0.0.5-APK
          path: out/Wudroid-0.0.5.apk
          if-no-files-found: error
          compression-level: 0
