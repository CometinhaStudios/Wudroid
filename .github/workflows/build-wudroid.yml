name: Build Wudroid APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Wudroid
        uses: actions/checkout@v6

      - name: Checkout Cemu Android core
        uses: actions/checkout@v6
        with:
          repository: SSimco/Cemu
          ref: android-port
          path: cemu-engine
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Apply Wudroid controls and settings integration
        shell: bash
        run: |
          set -euo pipefail
          APP="cemu-engine/src/android/app"
          JAVA="$APP/src/main/java/info/cemu/cemu"

          # Preserve the original Android frontend as a management activity.
          # It gives Wudroid a working native game library, title actions,
          # graphic packs and per-game Cemu profiles without replacing our UI.
          cp "$JAVA/MainActivity.kt" "$JAVA/WudroidManagerActivity.kt"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("cemu-engine/src/android/app/src/main/java/info/cemu/cemu/WudroidManagerActivity.kt")
          s = p.read_text()
          s = s.replace("class MainActivity : AppCompatActivity()", "class WudroidManagerActivity : AppCompatActivity()")
          p.write_text(s)
          PY

          rm -f "$JAVA/MainActivity.kt"
          cp wudroid-overlay/MainActivity.java "$JAVA/MainActivity.java"
          cp wudroid-overlay/WudroidSettingsActivity.kt "$JAVA/WudroidSettingsActivity.kt"
          cp wudroid-overlay/WudroidGamePathsActivity.kt "$JAVA/WudroidGamePathsActivity.kt"
          cp wudroid-overlay/WudroidTouchSettingsActivity.kt "$JAVA/WudroidTouchSettingsActivity.kt"
          cp wudroid-overlay/WudroidBootstrap.kt "$JAVA/WudroidBootstrap.kt"

          mkdir -p "$APP/src/main/assets"
          cp app/src/main/assets/index.html "$APP/src/main/assets/index.html"
          cp -a wudroid-overlay/res/. "$APP/src/main/res/"

          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("cemu-engine/src/android/app")

          gradle = app / "build.gradle.kts"
          s = gradle.read_text()
          s = s.replace('applicationId = "info.cemu.cemu"',
                        'applicationId = "com.cometinhastudios.wudroid"')
          s = re.sub(r'versionCode\s*=\s*getVersionCode\(\)', 'versionCode = 7', s)
          s = re.sub(r'versionName\s*=\s*getVersionName\(\)', 'versionName = "0.0.7"', s)
          gradle.write_text(s)

          strings = app / "src/main/res/values/strings.xml"
          if strings.exists():
              x = strings.read_text()
              x = re.sub(r'<string name="app_name">.*?</string>',
                         '<string name="app_name">Wudroid</string>', x, flags=re.S)
              strings.write_text(x)

          # Fresh installs should have touch controls visible immediately.
          settings = app / "src/main/java/info/cemu/cemu/common/settings/Settings.kt"
          if settings.exists():
              x = settings.read_text()
              x = x.replace(
                  "val isOverlayEnabled: Boolean = false",
                  "val isOverlayEnabled: Boolean = true"
              )
              settings.write_text(x)

          # Add Wudroid-only native management/settings activities while
          # preserving every upstream manifest declaration.
          manifest = app / "src/main/AndroidManifest.xml"
          x = manifest.read_text()
          marker = "info.cemu.cemu.WudroidSettingsActivity"
          if marker not in x:
              extra = """
              <activity android:name="info.cemu.cemu.WudroidSettingsActivity" android:exported="false" />
              <activity android:name="info.cemu.cemu.WudroidGamePathsActivity" android:exported="false" />
              <activity android:name="info.cemu.cemu.WudroidTouchSettingsActivity" android:exported="false" />
              <activity android:name="info.cemu.cemu.WudroidManagerActivity" android:exported="false" />
              """
              x = x.replace("</application>", extra + "\n    </application>")
              manifest.write_text(x)
          PY

      - name: Build release APK
        working-directory: cemu-engine/src/android
        env:
          VCPKG_FORCE_DOWNLOADED_BINARIES: 'true'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Sign installable APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find cemu-engine/src/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK was generated"
            exit 1
          fi

          keytool -genkeypair -v \
            -keystore out/wudroid-build.jks \
            -storepass wudroid \
            -keypass wudroid \
            -alias wudroid \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Wudroid Build,O=CometinhaStudios,C=BR" >/dev/null 2>&1

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 \
            "$APK" out/Wudroid-0.0.7-aligned.apk

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" sign \
            --ks out/wudroid-build.jks \
            --ks-pass pass:wudroid \
            --key-pass pass:wudroid \
            --out out/Wudroid-0.0.7.apk \
            out/Wudroid-0.0.7-aligned.apk

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose \
            out/Wudroid-0.0.7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Wudroid-0.0.7-APK
          path: out/Wudroid-0.0.7.apk
          if-no-files-found: error
          compression-level: 0
